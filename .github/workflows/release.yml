name: Release

# Validates and publishes the crates. It does NOT create a GitHub Release:
# releases are cut from ebpfsentinel-release, which dispatches this workflow
# with the version its release manifest declares for anomstream.
#
# The version is therefore an input, never inferred — this repository carries
# no release tags, so any inference would restart at `.1` every month and
# disagree with the manifest.
#
# The version is stamped (in-tree, not committed) into:
#   - every workspace Cargo.toml (workspace.package.version + path-dep
#     version specs that currently read `0.0.0-dev`)
#   - README.md (`cargo add` snippets)
#
# Then the same four family workflows that `ci.yml` runs (lint,
# test, build, security) are re-run against the stamped tree, plus
# a publish dry-run, before the crates are published.
#
# `cargo publish` runs in the `crates-io` environment, which is where a
# maintainer approval gate belongs if one is configured.

run-name: Release ${{ inputs.version }} ${{ inputs.tracking-id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (YYYY.M.X) — normally supplied by the release manifest"
        required: true
        type: string
      tracking-id:
        description: "Correlation id stamped by the orchestrating release run"
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]{4}\.[1-9][0-9]?\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected YYYY.M.X)"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing version: ${VERSION}"

  lint:
    name: Lint
    needs: prepare
    uses: ./.github/workflows/lint.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  test:
    name: Test
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  security:
    name: Security
    needs: prepare
    uses: ./.github/workflows/security.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish-dry-run:
    name: cargo publish --dry-run (anomstream-core)
    needs: [prepare, lint, test, build, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stamp-version
        with:
          version: ${{ needs.prepare.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only `anomstream-core` can dry-run before first publication —
      # the other members depend on `anomstream-core` by version
      # string, and cargo's dry-run resolves that against crates.io.
      # After core's first publish, expand to the full chain in
      # dependency order: core → triage → hotpath → anomstream.
      - uses: ./.github/actions/cargo-publish-dry-run
        with:
          package: anomstream-core

  crates-publish:
    name: cargo publish (crates.io)
    runs-on: ubuntu-latest
    needs: [prepare, lint, test, build, security, publish-dry-run]
    permissions:
      contents: read
      id-token: write # keyless build-provenance attestation
      attestations: write
    # Static `CARGO_REGISTRY_TOKEN` secret scoped to the `crates-io`
    # environment — generate at https://crates.io/settings/tokens
    # with `publish-new` + `publish-update` scopes.
    #
    # The `crates-io` GitHub environment also acts as a manual
    # approval gate when "Required reviewers" is configured in
    # repo Settings → Environments → crates-io.
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/stamp-version
        with:
          version: ${{ needs.prepare.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full publish chain in dependency order, single version
      # across all four members.
      #
      # `cargo publish` since 1.66 waits for the just-published
      # crate to appear in the registry index before exiting, so
      # a sequential chain works without explicit sleeps — even
      # for the very first release where none of the crates yet
      # exist on crates.io.
      #
      # If any member's `version = X` already exists on crates.io
      # the run fails fast (`crate version is already uploaded`).
      # Bump the workspace version and re-run the workflow.
      - shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euxo pipefail
          cargo publish -p anomstream-core    --allow-dirty
          cargo publish -p anomstream-triage  --allow-dirty
          cargo publish -p anomstream-hotpath --allow-dirty
          cargo publish -p anomstream         --allow-dirty

      # Attest provenance of the packaged .crate files (cargo publish
      # leaves them under target/package/). Verifiable with
      # `gh attestation verify <file>.crate --owner ebpfsentinel`.
      - name: Attest crate provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/package/*.crate
